<!DOCTYPE html>
<html lang="en" data-scheme="paper" data-mode="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Runway</title>
<script>
  /* Set the theme before first paint. Without this the page renders light and
     then flips, which is worse than a slow load. */
  try {
    var t = JSON.parse(localStorage.getItem('runway.theme.v1') || '{}');
    var scheme = ['paper', 'clay', 'signal'].indexOf(t.scheme) >= 0 ? t.scheme : 'paper';
    var mode = t.followSystem === false && (t.mode === 'dark' || t.mode === 'light')
      ? t.mode
      : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.dataset.scheme = scheme;
    document.documentElement.dataset.mode = mode;
  } catch (e) { /* defaults in the markup stand */ }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/chrome.css">
<link rel="stylesheet" href="css/canvas.css">
<link rel="stylesheet" href="css/bucket.css">
<link rel="stylesheet" href="css/popover.css">
<link rel="stylesheet" href="css/calendar.css">
<link rel="stylesheet" href="css/sprints.css">
</head>
<body>

<header id="bar">
  <h1>Runway</h1>
  <nav class="group" id="viewSwitch">
    <button class="tool on" data-view="sprints">Sprints</button>
    <button class="tool" data-view="canvas">Canvas</button>
    <button class="tool" data-view="calendar">Month</button>
  </nav>
  <button class="tool" data-act="add-bucket" hidden>+ Bucket</button>
  <button class="tool" data-act="home" hidden>Home</button>
  <span class="spacer"></span>
  <button class="tool" data-act="undo" title="Undo (⌘Z)">Undo</button>
  <button class="tool" data-act="export">Export</button>
  <button class="tool" data-act="import">Import</button>
  <span class="rule"></span>
  <select class="tool" id="schemePick" aria-label="Colour scheme"></select>
  <button class="tool" data-act="mode" id="modeToggle" aria-label="Toggle light and dark"></button>
  <span class="rule" data-canvas-only hidden></span>
  <button class="tool" data-act="zoom-out" aria-label="Zoom out" hidden>&minus;</button>
  <span class="eyebrow zoom" id="zoomLabel" hidden>100%</span>
  <button class="tool" data-act="zoom-in" aria-label="Zoom in" hidden>+</button>
</header>

<section id="sprints"></section>

<main id="scroller" hidden>
  <div id="canvas">
    <div id="world">
      <svg id="layer-under" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="layer-nodes"></div>
      <svg id="layer-over" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>
</main>

<section id="calendar" hidden></section>

<aside id="legend" hidden></aside>

<p id="hint" hidden>
  Drag a bucket by its header &middot; drag empty space to pan<br>
  Drag a <b>&#9711;</b> onto another card or row to connect<br>
  Click a line to retype, reroute, or cut it
</p>

<input type="file" id="fileInput" accept="application/json" hidden>

<script type="module" src="js/main.js"></script>
</body>
</html>
